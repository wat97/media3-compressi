name: vidsqueeze
description: Flutter video compression plugin with Android Media3 core and iOS-native parity scaffolding.
version: 0.1.0-dev.1
homepage: https://github.com/wat97/media3-compressi
repository: https://github.com/wat97/media3-compressi
issue_tracker: https://github.com/wat97/media3-compressi/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.enb.vidsqueeze
        pluginClass: VidsqueezePlugin
      ios:
        pluginClass: VidsqueezePlugin

