name: vidsqueeze
description: Native video compression for Flutter using Android Media3 and iOS AVFoundation, with progress streams, codec fallback, and MP4 output.
version: 0.1.0-dev.2
homepage: https://github.com/wat97/media3-compressi
repository: https://github.com/wat97/media3-compressi
issue_tracker: https://github.com/wat97/media3-compressi/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.wat.vidsqueeze
        pluginClass: VidsqueezePlugin
      ios:
        pluginClass: VidsqueezePlugin
